---
# The recreated StatefulSets must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the HdfsCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available hdfsclusters.hdfs.stackable.tech/hdfs --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-namenode-default
  ownerReferences:
    - apiVersion: hdfs.stackable.tech/v1alpha1
      controller: true
      kind: HdfsCluster
      name: hdfs
status:
  readyReplicas: 2
  replicas: 2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-datanode-default
  ownerReferences:
    - apiVersion: hdfs.stackable.tech/v1alpha1
      controller: true
      kind: HdfsCluster
      name: hdfs
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hdfs-journalnode-default
  ownerReferences:
    - apiVersion: hdfs.stackable.tech/v1alpha1
      controller: true
      kind: HdfsCluster
      name: hdfs
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: v1
kind: ServiceAccount
